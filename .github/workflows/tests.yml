name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run unit tests
        run: dotnet test tests/CaseFraudSys.Api.Tests --filter "Category=Unit" --verbosity normal

  integration-tests:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then
              echo "DynamoDB Local is ready."
              exit 0
            fi
            echo "Waiting for DynamoDB Local... ($i/30)"
            sleep 2
          done
          echo "DynamoDB Local did not become ready in time."
          exit 1

      - name: Run integration tests
        run: dotnet test tests/CaseFraudSys.Api.IntegrationTests --filter "Category=Integration" --verbosity normal
